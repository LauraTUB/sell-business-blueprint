<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build It Like You’ll Sell It: The Eight Value Drivers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FDFFF2;
    --surface: #FFFFFF;
    --ink: #192520;
    --head: #23392F;
    --em: #23392F;
    --muted: #55645B;
    --line: #DCE3D8;
    --sage: #9EAF9F;
    --sage-soft: #EDF2EA;
    --hl: #F0FE91;
    --hl-ink: #192520;
    --band: #23392F;
    --band-ink: #FDFFF2;
    --shadow: 0 2px 8px rgba(35, 57, 47, 0.08);
    --serif: Georgia, "Times New Roman", serif;
    --sans: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #192520; --surface: #20302A; --ink: #FDFFF2; --head: #FDFFF2; --em: #F0FE91;
      --muted: #BCC8BD; --line: #31453A; --sage-soft: #24362E; --band: #23392F;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.25); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #192520; --surface: #20302A; --ink: #FDFFF2; --head: #FDFFF2; --em: #F0FE91;
    --muted: #BCC8BD; --line: #31453A; --sage-soft: #24362E; --band: #23392F;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.25); color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 300 17px/1.65 var(--sans); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
  button { font: inherit; }
  :focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; border-radius: 6px; }

  /* Header */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--band); color: var(--band-ink); }
  .top-in { max-width: 1280px; margin: 0 auto; padding: 12px clamp(16px, 4vw, 40px); display: flex; align-items: center; gap: 16px; }
  .top img { height: 22px; width: auto; display: block; }
  .top .ttl { font: 600 13px/1.3 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; margin-left: auto; text-align: right; }
  .top .ttl b { display: block; font-weight: 700; color: var(--hl); letter-spacing: 0.04em; text-transform: none; font-size: 14px; }
  .menu-btn { display: none; border: 1px solid rgba(253, 255, 242, 0.35); background: transparent; color: var(--band-ink); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .bar { height: 4px; background: rgba(253, 255, 242, 0.15); }
  .bar i { display: block; height: 100%; width: 0; background: var(--hl); transition: width 300ms ease; }

  /* Layout */
  .wrap { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); padding: 32px clamp(16px, 4vw, 40px) 120px; }
  .rail { position: sticky; top: 96px; align-self: start; }
  .rail h2 { font: 700 12px/1.3 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .rail button { width: 100%; display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14.5px; line-height: 1.3; transition: background 200ms ease; }
  .rail button:hover { background: var(--sage-soft); }
  .rail button[aria-current="step"] { background: var(--band); color: #FDFFF2; }
  .rail .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--sans); border: 1.5px solid var(--sage); color: var(--muted); }
  .rail button[aria-current="step"] .n { border-color: var(--hl); color: var(--hl); }
  .rail .done .n { background: var(--sage); border-color: var(--sage); color: #192520; }
  .rail .n.ic { border-color: transparent; color: var(--head); background: var(--sage-soft); }
  .rail button[aria-current="step"] .n.ic { background: rgba(240, 254, 145, 0.16); color: var(--hl); border-color: transparent; }
  .rail .done .n.ic { background: var(--sage); color: #192520; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .rail .group { margin: 10px 0 4px 10px; font: 700 11px/1.3 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .rail .mins { font-size: 12px; color: var(--muted); }
  .rail button[aria-current="step"] .mins { color: inherit; opacity: 0.75; }
  .rail .credit { margin-top: 18px; font-size: 12.5px; line-height: 1.5; color: var(--muted); }

  .stage { min-width: 0; max-width: 860px; }
  .stage:focus { outline: none; }
  .eyebrow { font: 700 12px/1.3 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  h1, h2.h { font-family: var(--serif); font-weight: 500; color: var(--head); letter-spacing: -0.015em; margin: 0; }
  h1 { font-size: clamp(2.4rem, 5vw, 3.4rem); line-height: 1.08; }
  h2.h { font-size: clamp(1.9rem, 3.6vw, 2.5rem); line-height: 1.12; }
  h1 em, h2.h em { font-style: italic; color: var(--em); }
  .lead { font-size: clamp(1.05rem, 1.6vw, 1.2rem); line-height: 1.6; margin: 16px 0 0; max-width: 62ch; }
  .one { font: 600 1.05rem/1.5 var(--sans); color: var(--head); margin: 14px 0 0; max-width: 62ch; }
  p { max-width: 68ch; }
  .stage p.body { margin: 18px 0 0; }

  /* Hero (welcome) */
  .hero { background: var(--band); color: #FDFFF2; border-radius: 16px; padding: clamp(28px, 5vw, 56px); position: relative; overflow: hidden;
    background-image: radial-gradient(1200px 400px at 110% -10%, rgba(158, 175, 159, 0.28), transparent 60%), radial-gradient(800px 500px at -20% 120%, rgba(25, 37, 32, 0.9), transparent 60%); }
  .hero h1 { color: #FDFFF2; }
  .hero h1 em { color: var(--hl); }
  .hero .lead { color: rgba(253, 255, 242, 0.88); }
  .hero .icon { position: absolute; right: clamp(16px, 4vw, 48px); top: clamp(16px, 4vw, 40px); width: clamp(56px, 9vw, 96px); opacity: 0.9; }
  .hero .meta { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; font: 600 13px/1 var(--sans); }
  .hero .meta span { border: 1px solid rgba(253, 255, 242, 0.3); border-radius: 999px; padding: 8px 12px; color: rgba(253, 255, 242, 0.9); }

  /* Cards */
  .trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 26px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); }
  .card h3 { font: 700 15px/1.3 var(--sans); color: var(--head); margin: 0 0 8px; display: flex; gap: 10px; align-items: center; }
  .card p { margin: 0; font-size: 15.5px; line-height: 1.6; }
  .tag { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 6px; background: var(--hl); color: var(--hl-ink); font: 700 12px/1 var(--sans); }
  .card.lever { background: var(--band); border-color: var(--band); color: #FDFFF2; }
  .card.lever h3 { color: var(--hl); }
  .hero .trio .card { background: rgba(253, 255, 242, 0.06); border-color: rgba(253, 255, 242, 0.18); box-shadow: none; color: #FDFFF2; }
  .hero .trio .card h3 { color: var(--hl); }

  /* Book reference */
  .bookcard { margin-top: 26px; background: var(--band); color: #FDFFF2; border-radius: 14px; padding: clamp(20px, 3vw, 30px); max-width: 640px; border-left: 6px solid var(--hl);
    display: flex; gap: clamp(16px, 3vw, 26px); align-items: center; }
  .bookcard .bk-cover { flex: none; width: 112px; height: auto; border-radius: 4px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); }
  .bookcard .bk-text { min-width: 0; }
  @media (max-width: 520px) { .bookcard { flex-direction: column; align-items: flex-start; } .bookcard .bk-cover { width: 96px; } }
  .bookcard .bk-label { font: 700 12px/1.3 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--hl); margin-bottom: 10px; }
  .bookcard .bk-title { font: 500 clamp(1.3rem, 2.4vw, 1.6rem)/1.3 var(--serif); margin: 0; }
  .bookcard .bk-meta { margin: 8px 0 0; font-size: 15px; opacity: 0.85; }
  .bookcard .bk-note { margin: 12px 0 0; font-size: 14.5px; opacity: 0.85; }

  /* Calculator */
  .calc { margin-top: 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 3vw, 28px); box-shadow: var(--shadow); }
  .calc label { display: block; font: 700 14px/1.3 var(--sans); color: var(--head); margin-bottom: 8px; }
  .calc .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
  .calc input[type="range"] { width: 100%; accent-color: var(--head); }
  .calc .pval { font: 500 1.6rem/1.2 var(--serif); color: var(--head); margin-top: 4px; }
  .seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .seg button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 10px 6px; font-size: 13.5px; line-height: 1.25; cursor: pointer; transition: background 200ms ease, border-color 200ms ease; }
  .seg button[aria-pressed="true"] { background: var(--head); color: var(--bg); border-color: var(--head); font-weight: 600; }
  .result { margin-top: 22px; display: grid; grid-template-columns: auto 1fr; gap: 6px 24px; align-items: end; padding-top: 18px; border-top: 1px solid var(--line); }
  .result .big { font: 500 clamp(2rem, 4.5vw, 2.8rem)/1 var(--serif); color: var(--head); }
  .result .big mark { background: var(--hl); color: var(--hl-ink); padding: 0 8px; border-radius: 6px; }
  .result small { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .result .delta { font-size: 15px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 14px; }

  /* Quick check */
  .check { margin-top: 26px; border: 1.5px dashed var(--sage); border-radius: 14px; padding: clamp(18px, 3vw, 26px); }
  .check .q { font: 600 1.05rem/1.45 var(--sans); color: var(--head); margin: 6px 0 14px; }
  .opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .opts button { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 12px 14px; text-align: left; font-size: 15px; line-height: 1.35; cursor: pointer; transition: border-color 200ms ease, background 200ms ease; }
  .opts button:hover { border-color: var(--sage); }
  .opts button[aria-pressed="true"] { border-color: var(--head); background: var(--sage-soft); font-weight: 600; }
  .fb { margin: 14px 0 0; padding: 12px 14px; border-left: 4px solid var(--hl); background: var(--sage-soft); border-radius: 0 8px 8px 0; font-size: 15px; }
  .fb[hidden] { display: none; }

  /* Visuals */
  .viz { margin-top: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
  .viz svg { display: block; width: 100%; height: auto; }
  .viz .cap { font-size: 13.5px; color: var(--muted); margin: 10px 0 0; }
  .viz .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin-bottom: 10px; }
  .viz .toggle button { border: 0; background: transparent; color: var(--muted); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .viz .toggle button[aria-pressed="true"] { background: var(--head); color: var(--bg); }
  .svg-text { font-family: Inter, -apple-system, "Segoe UI", sans-serif; }

  /* Summary */
  .sum { margin-top: 24px; display: grid; gap: 10px; }
  .sum-row { display: grid; grid-template-columns: 190px 1fr 110px; gap: 14px; align-items: center; }
  .sum-row .nm { font-weight: 600; font-size: 15px; }
  .sum-row .track { height: 12px; background: var(--sage-soft); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .sum-row .track i { display: block; height: 100%; background: var(--sage); border-radius: 6px; transition: width 400ms ease; }
  .sum-row.start .track i { background: var(--hl); }
  .sum-row .lv { font-size: 13.5px; color: var(--muted); text-align: right; }
  .sum-row.start .nm::after { content: "Start here"; margin-left: 8px; font: 700 11px/1 var(--sans); background: var(--hl); color: var(--hl-ink); padding: 4px 7px; border-radius: 5px; vertical-align: 2px; }
  .callout { margin-top: 24px; background: var(--band); color: #FDFFF2; border-radius: 14px; padding: clamp(18px, 3vw, 26px); }
  .callout h3 { font: 500 1.4rem/1.25 var(--serif); margin: 0 0 8px; color: #FDFFF2; }
  .callout h3 em { color: var(--hl); }
  .callout p { margin: 0; }
  .callout .prompt { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .callout code { background: rgba(253, 255, 242, 0.1); border: 1px solid rgba(253, 255, 242, 0.25); padding: 8px 12px; border-radius: 8px; font: 500 14.5px/1.3 var(--sans); }
  .groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
  .groups .card ul { margin: 10px 0 0; padding-left: 18px; font-size: 14.5px; }
  .groups .card ul li { margin: 3px 0; }

  /* Bottom nav */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .nav-in { max-width: 1280px; margin: 0 auto; padding: 12px clamp(16px, 4vw, 40px); display: flex; align-items: center; gap: 12px; }
  .nav .left { font-size: 13.5px; color: var(--muted); }
  .nav .sp { margin-left: auto; display: flex; gap: 10px; }
  .btn { border: 0; border-radius: 8px; padding: 12px 24px; font: 700 15px/1 var(--sans); cursor: pointer; transition: filter 200ms ease, background 200ms ease; }
  .btn.primary { background: var(--hl); color: var(--hl-ink); }
  .btn.primary:hover { filter: brightness(0.92); }
  .btn.secondary { background: transparent; color: var(--head); border: 1.5px solid var(--line); }
  .btn.secondary:hover { background: var(--sage-soft); }
  .btn[disabled] { opacity: 0.4; cursor: default; }
  .btn.dark { background: var(--head); color: var(--bg); }

  /* Chapter list on phones */
  dialog.sheet { width: min(420px, calc(100% - 24px)); max-height: 85vh; border: 0; border-radius: 14px; padding: 18px; background: var(--bg); color: var(--ink); }
  dialog.sheet::backdrop { background: rgba(25, 37, 32, 0.55); }
  dialog.sheet .rail { position: static; }
  dialog.sheet .close { float: right; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; cursor: pointer; font-size: 18px; }

  .fade { animation: fade 300ms ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } .bar i, .sum-row .track i { transition: none; } }

  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; padding-top: 22px; }
    .wrap > .rail { display: none; }
    .menu-btn { display: inline-block; margin-left: auto; flex: none; }
    .top img { height: 16px; min-width: 0; max-width: calc(100% - 120px); object-fit: contain; object-position: left center; }
    .top .ttl { display: none; }
    .trio, .groups { grid-template-columns: 1fr; }
    .opts { grid-template-columns: 1fr; }
    .calc .row { grid-template-columns: 1fr; }
    .seg { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sum-row { grid-template-columns: 1fr 90px; }
    .sum-row .track { grid-column: 1 / -1; grid-row: 2; }
    .nav .left { display: none; }
    .btn { padding: 12px 18px; }
  }
</style>
</head>

  var DRIVERS = [
    { key: "financial", name: "Financial Performance", title: "Clean books, <em>real</em> profit",
      one: "How much the business earns after paying someone a fair wage to do your job, and how clean the records are that prove it.",
      buyer: "Buyers pay for profit they can verify. Messy books shrink the number, and so does a margin that only exists because you pay yourself too little.",
      tuesday: "Clean monthly numbers mean you make decisions in minutes, and you finally see which work pays and which work just keeps you busy.",
      lever: "Get a monthly P&L you trust, then raise the price on your most underpriced offer.",
      q: "Do you know your profit after paying yourself a market salary, without digging for it?",
      opts: ["No idea", "Roughly", "Yes, every month"],
      fb: ["Start with the number. Ask your bookkeeper for last year’s P&L, subtract what it would cost to hire someone into your seat, and you have the profit a buyer sees.",
           "You’re close. Turning “roughly” into a monthly number you trust is the fastest way to spot where your margin leaks.",
           "That’s a real strength. Buyers trust owners who know their numbers, and you get to make faster calls every week."] },
    { key: "growth", name: "Growth Potential", title: "Room to <em>grow</em> without you",
      one: "How easily the business could grow, and whether it can grow without you adding hours.",
      buyer: "A buyer pays for the growth they can see. A proven offer that could sell in more places, to more people or through partners raises the price.",
      tuesday: "When growth runs on a repeatable offer instead of your personal effort, a bigger month stops meaning a longer week.",
      lever: "Package your core offer with a set scope, price and process, so it sells and delivers the same way every time.",
      q: "Could you double revenue with your current team and your current offer?",
      opts: ["No, I’d need to rebuild", "Yes, with more people", "Yes, the offer scales"],
      fb: ["Growth that needs a rebuild is growth a buyer won’t pay for yet. Packaging one offer you can repeat is the first step.",
           "Good starting point. The more of the delivery you can standardize, the fewer people each new dollar needs.",
           "That’s exactly what a buyer wants to see. Write down how it scales so it doesn’t live only in your head."] },
    { key: "switzerland", name: "Switzerland Structure", title: "No single point of <em>failure</em>",
      one: "How much rides on any one customer, employee or supplier. The business stays neutral, like Switzerland, and depends on no single party.",
      buyer: "If one customer is a big slice of revenue, a buyer sees the day that customer leaves. Same for the one employee who knows everything, and the one supplier you can’t replace.",
      tuesday: "When no single customer can sink you, you can turn down bad terms, raise prices with confidence and sleep through the renewal date.",
      lever: "Win customers outside your biggest account until none is more than about 15% of revenue, and cross-train the one person you couldn’t lose.",
      q: "What share of revenue comes from your single biggest customer?",
      opts: ["Over 25%", "15% to 25%", "Under 15%"],
      fb: ["That’s the risk buyers spot first. Every new customer outside that account makes the business safer and gives you more room to say no.",
           "Worth watching. Two or three new customers in a different segment would bring that share down fast.",
           "Strong. Keep it that way as you grow, and look at your team and suppliers through the same lens."] },
    { key: "teeter", name: "Valuation Teeter-Totter", title: "Get paid <em>first</em>",
      one: "Whether cash comes in before, during or after the work.",
      buyer: "A business that waits to get paid needs cash just to operate, and buyers take that cash need off the price. Getting paid up front tips the teeter-totter in your favor.",
      tuesday: "Deposits and upfront payments mean less chasing invoices, less float on your credit card and a calmer bank balance every month.",
      lever: "Put a deposit or upfront payment on your next five deals, and collect what’s overdue.",
      q: "When do you usually get paid?",
      opts: ["After the work", "As we go", "Before the work"],
      fb: ["You’re funding your customers right now. A deposit on new work is often the simplest change in this whole masterclass.",
           "Halfway there. Moving the first payment to the start of the work tips the balance further.",
           "That’s the best side of the teeter-totter to sit on. Your customers fund the work, and buyers love that."] },
    { key: "recurring", name: "Recurring Revenue", title: "Revenue that <em>shows up</em>",
      one: "How much revenue arrives next month without a single sales call.",
      buyer: "Subscriptions, retainers and contracts are the revenue buyers pay the most for, because they can count on it from day one.",
      tuesday: "Starting every month already partly paid takes the pressure off sales and lets you plan hiring and spending with confidence.",
      lever: "Turn your most repeated project into a retainer or subscription, and offer it to your three best customers first.",
      q: "How much of next month’s revenue is already locked in?",
      opts: ["Under 10%", "10% to 30%", "Over 30%"],
      fb: ["Every month starts from zero, which is exhausting and hard to sell. One retainer offer changes that faster than you’d expect.",
           "A solid base. Putting it on contracts or auto-renewal makes it count for even more.",
           "That’s a big advantage. Protect it with clear terms and a renewal date you track."] },
    { key: "monopoly", name: "Monopoly Control", title: "Be the <em>obvious</em> choice",
      one: "Whether you can raise prices without losing customers.",
      buyer: "If customers could get the same thing from three competitors, you’re priced like a commodity. Owning a niche, or a way of doing the work that’s hard to copy, earns a premium.",
      tuesday: "When you’re the obvious choice, you stop competing on price, spend less time convincing and get customers who arrive ready to buy.",
      lever: "Narrow to the one thing you do better than anyone, and raise the price there first.",
      q: "The last time you raised prices, what happened?",
      opts: ["Haven’t in 2+ years", "Lost a few customers", "Nobody left"],
      fb: ["Your costs have gone up and your prices haven’t. A small rise on your most valuable offer tests how much pricing power you have.",
           "That’s useful information. The customers who stayed are your niche, so build your positioning around them.",
           "That’s pricing power, and buyers pay a premium for it."] },
    { key: "satisfaction", name: "Customer Satisfaction", title: "Proof they’d <em>stay</em>",
      one: "Whether customers stay, buy again and send their friends, and whether you can prove it.",
      buyer: "A buyer wants evidence that customers will stay after you leave. Referrals, repeat purchases and a satisfaction score tracked over time are that evidence.",
      tuesday: "Happy customers who refer cut what you spend to win new ones, and a simple score warns you about problems before they cost you an account.",
      lever: "Send a two-question survey after every delivery, and ask happy customers for one referral.",
      q: "Do you measure customer satisfaction?",
      opts: ["No", "Informally", "Yes, with a score we track"],
      fb: ["You probably have happy customers, but no proof. One short survey after each delivery starts building it.",
           "A good instinct. Turning it into a simple score you track monthly makes it something a buyer can see.",
           "Excellent. Pair it with a referral ask and it turns into growth, not just a number."] },
    { key: "hub", name: "Hub and Spoke", title: "The business that runs <em>without</em> you",
      one: "What keeps running if you disappear for four weeks.",
      buyer: "If you’re the hub, every sale, decision and relationship runs through you. A buyer sees a job they’d have to fill on day one, so they pay less or tie part of the price to you staying for years.",
      tuesday: "Every function you hand off is hours back in your week and one less thing that stops when you take a vacation.",
      lever: "Pick the one function only you do, write down how you do it, and hand it to one person this month.",
      q: "If you vanished for four weeks with no phone, what would happen?",
      opts: ["Revenue stops", "Things slow down", "It keeps running"],
      fb: ["This is the biggest lever you have, for your value and your sanity. Start with one function, not all of them.",
           "You’ve built something that mostly holds. Find the decisions that wait for you and hand over the rules for making them.",
           "That’s the goal. You own a business, and a buyer will see it the same way."] }

      if (i === FIRST_DRIVER + 8) h += '<li class="group" aria-hidden="true">Put it to work</li>';
      var cur = i === state.ch, done = state.seen[c.id] && !cur;
      h += '<li class="' + (done ? "done" : "") + '"><button type="button" data-go="' + i + '"' + (cur ? ' aria-current="step"' : "") + '>' +

        Math.max(1, Math.round(c.mins)) + ' min</span></button></li>';
    });
    return h + '</ol><p class="credit">Built on John Warrillow’s work on business value, including his book <i>Built to Sell</i>. A masterclass by The Uncommon Business.</p>';

  /* ---------- Chapter renderers ---------- */
  function welcome() {
    return '<section class="hero fade"><img class="icon" src="' + ICON.operate + '" alt="">' +
      '<p class="eyebrow" style="color:rgba(253,255,242,0.7)">The Uncommon Business masterclass</p>' +
      '<h1>Build it like you’ll <em>sell it.</em></h1>' +
      '<p class="lead">Fifteen minutes on the eight drivers buyers use to value a business, and why the same eight make yours easier to run starting this week.</p>' +
      '<div class="meta"><span>About 15 minutes</span><span>8 value drivers</span><span>Built-in quick check</span></div>' +
      '<div class="trio">' +
        card("Easier to run", "Every driver that raises your value also takes something off your plate, so you feel it long before any sale.", "1") +
        card("Worth more", "Buyers pay a higher multiple for a business that doesn’t need its owner, sometimes several times more for the same profit.", "2") +
        card("Your choice", "Sell it, keep it or step back from it. A business that runs without you gives you all three options.", "3") +
      '</div></section>' +
      '<p class="body">Most owners only think about value when they’re ready to sell, and by then the business has been built around them for years. A buyer looks at that and sees risk, so they offer less or ask the owner to stay on for years to keep it running.</p>' +
      '<p class="body">The owners who get the BEST price start early. They build the business as if they’ll sell it, even if they never do, and they get a bonus most people never talk about: a business that stops needing them every single day. That’s the same work, and it pays you twice.</p>' +
      '<p class="body">In each chapter you’ll see what a buyer looks at, what it changes for you now, and the one lever to pull. Answer the quick check at the end of each driver, and you’ll get your own quick read at the end.</p>';
  }
  function card(t, p, n, cls) {
    return '<div class="card ' + (cls || "") + '"><h3>' + (n ? '<span class="tag">' + n + '</span>' : "") + t + '</h3><p>' + p + '</p></div>';
  }

  var calc = { profit: 300000, stop: 0 };
  var STOPS = [
    { label: "Almost everything", mult: 2.0, band: "Owner-Trapped" },
    { label: "Most of it", mult: 3.0, band: "Operating" },
    { label: "Some of it", mult: 4.25, band: "Transferable" },
    { label: "Almost nothing", mult: 6.0, band: "Sellable" }
  ];
  function pricing() {
    var segs = STOPS.map(function (s, i) { return '<button type="button" data-stop="' + i + '" aria-pressed="' + (i === calc.stop) + '">' + s.label + '</button>'; }).join("");
    return '<div class="fade"><p class="eyebrow">The big idea</p><h2 class="h">Value is profit times <em>confidence</em></h2>' +
      '<p class="lead">A buyer prices a business with two numbers: the profit it makes, and how many years of that profit they’re willing to pay for today. That second number is the multiple, and it rises with how confident they are the profit keeps coming after you leave.</p>' +
      '<p class="body">Profit here means what the business earns after paying someone a fair wage to do your job, because a buyer has to pay that person. Try it below. Keep the profit the same and change how much of the business runs through you.</p>' +
      '<div class="calc"><div class="row">' +
        '<div><label for="profit">Profit after paying someone to do your job</label><input type="range" id="profit" min="100000" max="1000000" step="25000" value="' + calc.profit + '" aria-describedby="pval"><div class="pval" id="pval"></div></div>' +
        '<div><label id="stopLbl">How much runs through you</label><div class="seg" role="group" aria-labelledby="stopLbl">' + segs + '</div></div>' +
      '</div><div class="result" aria-live="polite"><div><small>Ballpark value</small><div class="big" id="val"></div></div><div class="delta" id="delta"></div></div>' +
      '<p class="note">Illustration only. Real multiples depend on your industry, your size and who is buying.</p></div>' +
      '<p class="body">From one end to the other, the profit stays the same and the value triples. Every one of the eight drivers ahead moves that multiple, and most of them move the profit too.</p></div>';
  }
  function updateCalc() {
    var s = STOPS[calc.stop], mid = calc.profit * s.mult;
    $("pval").textContent = money(calc.profit);
    $("val").innerHTML = '<mark>' + money(round5k(mid * 0.85)) + ' to ' + money(round5k(mid * 1.15)) + '</mark>';
    var base = calc.profit * STOPS[0].mult;
    $("delta").innerHTML = calc.stop === 0
      ? 'At about <b>' + s.mult + 'x</b>, a buyer sees an <b>' + s.band + '</b> business. Pick another option to see what changes.'
      : 'About <b>' + s.mult + 'x</b>, a <b>' + s.band + '</b> business. That’s about <b>' + money(round5k(mid - base)) + ' more</b> than when almost everything runs through you, for the same profit.';
  }

  function driver(i) {
    var d = DRIVERS[i], a = state.ans[d.key];
    var opts = d.opts.map(function (o, k) { return '<button type="button" data-ans="' + k + '" aria-pressed="' + (a === k) + '">' + o + '</button>'; }).join("");
    return '<div class="fade"><p class="eyebrow">Driver ' + (i + 1) + ' of 8: ' + d.name + '</p><h2 class="h">' + d.title + '</h2>' +
      '<p class="one">' + d.one + '</p>' +
      '<div class="trio">' + card("What a buyer sees", d.buyer, "") + card("What it changes for you now", d.tuesday, "") + card("The lever to pull", d.lever, "", "lever") + '</div>' +
      vizFor(d.key, a) +
      '<div class="check"><p class="eyebrow">Quick check</p><p class="q" id="q-' + d.key + '">' + d.q + '</p>' +
        '<div class="opts" role="group" aria-labelledby="q-' + d.key + '">' + opts + '</div>' +
        '<p class="fb" id="fb" aria-live="polite"' + (a == null ? " hidden" : "") + '>' + (a == null ? "" : d.fb[a]) + '</p></div></div>';
  }

  function vizFor(key, a) {
    if (key === "teeter") return '<div class="viz"><div id="seesaw">' + seesaw(a) + '</div><p class="cap">The earlier you get paid, the higher your side rises. Answer the quick check to see where you sit.</p></div>';
    if (key === "hub") return '<div class="viz"><div class="toggle" role="group" aria-label="View"><button type="button" data-hub="0" aria-pressed="true">Today, for most owners</button><button type="button" data-hub="1" aria-pressed="false">Built to sell</button></div><div id="hubviz">' + hub(0) + '</div><p class="cap" id="hubcap">Everything runs through the owner. When the owner stops, so does the business.</p></div>';
    if (key === "switzerland") return '<div class="viz">' + concentration() + '<p class="cap">Two businesses with the same revenue. On the left, losing the biggest customer takes 40% of sales with it. On the right, no customer is more than 12%.</p></div>';
    return "";
  }

  function seesaw(pos) {

    return '<svg viewBox="0 0 600 220" role="img" aria-label="' + (none ? "Teeter-totter, level" : "Teeter-totter tipped toward " + (pos === 2 ? "you" : pos === 1 ? "neither side" : "your customers")) + '">' +
      '<polygon points="300,170 270,205 330,205" fill="var(--sage)"/>' +
      '<g style="transition:transform 500ms ease;transform-origin:300px 168px;transform:rotate(' + ang + 'deg)">' +
        '<rect x="70" y="160" width="460" height="10" rx="5" fill="var(--head)"/>' +
        '<rect x="80" y="118" width="120" height="40" rx="8" fill="var(--sage-soft)" stroke="var(--line)"/>' +
        '<text x="140" y="143" text-anchor="middle" class="svg-text" font-size="15" font-weight="600" fill="var(--ink)">Your customers</text>' +
        '<rect x="400" y="118" width="120" height="40" rx="8" fill="var(--hl)"/>' +
        '<text x="460" y="143" text-anchor="middle" class="svg-text" font-size="15" font-weight="700" fill="#192520">You</text>' +
      '</g>' +
      '<text x="300" y="30" text-anchor="middle" class="svg-text" font-size="14" fill="var(--muted)">You get paid: <tspan font-weight="700" fill="var(--ink)">' + labels + '</tspan></text></svg>';
  }

  function hub(mode) {
    var nodes = [["Sales", 120, 60], ["Delivery", 480, 60], ["Customers", 120, 200], ["Approvals", 480, 200]];
    var h = '<svg viewBox="0 0 600 260" role="img" aria-label="' + (mode ? "Each function led by a team member" : "Every function connected to the owner") + '">';
    if (!mode) {
      nodes.forEach(function (n) { h += '<line x1="300" y1="130" x2="' + n[1] + '" y2="' + n[2] + '" stroke="var(--head)" stroke-width="3"/>'; });
      h += '<circle cx="300" cy="130" r="44" fill="var(--hl)"/><text x="300" y="136" text-anchor="middle" class="svg-text" font-size="16" font-weight="700" fill="#192520">You</text>';
      nodes.forEach(function (n) { h += node(n[0], n[1], n[2], false); });
    } else {
      var leads = [["Sales lead", 120, 60], ["Delivery lead", 480, 60], ["Account lead", 120, 200], ["Operations lead", 480, 200]];
      leads.forEach(function (n) { h += '<line x1="300" y1="130" x2="' + n[1] + '" y2="' + n[2] + '" stroke="var(--sage)" stroke-width="2"/>'; });
      h += '<rect x="170" y="100" width="260" height="60" rx="30" fill="var(--surface)" stroke="var(--sage)" stroke-dasharray="6 6"/>' +
        '<text x="300" y="126" text-anchor="middle" class="svg-text" font-size="13" font-weight="600" fill="var(--ink)">The business</text>' +
        '<text x="300" y="145" text-anchor="middle" class="svg-text" font-size="13" fill="var(--muted)">systems, playbooks, numbers</text>';
      leads.forEach(function (n) { h += node(n[0], n[1], n[2], true); });
      h += '<circle cx="300" cy="40" r="26" fill="var(--hl)"/><text x="300" y="45" text-anchor="middle" class="svg-text" font-size="13" font-weight="700" fill="#192520">You</text>';
    }
    return h + '</svg>';
  }
  function node(t, x, y, lead) {
    var w = lead ? 150 : 120;
    return '<rect x="' + (x - w / 2) + '" y="' + (y - 20) + '" width="' + w + '" height="40" rx="10" fill="var(--surface)" stroke="var(--head)" stroke-width="1.5"/>' +
      '<text x="' + x + '" y="' + (y + 5) + '" text-anchor="middle" class="svg-text" font-size="14" font-weight="600" fill="var(--ink)">' + t + '</text>';
  }

  function concentration() {
    var A = [40, 15, 12, 10, 8, 15], B = [12, 11, 10, 10, 9, 9, 8, 8, 8, 15];
    function bar(arr, y, label) {
      var x = 20, h = '<text x="20" y="' + (y - 10) + '" class="svg-text" font-size="13" font-weight="600" fill="var(--ink)">' + label + '</text>';
      arr.forEach(function (v, i) {
        var w = v * 5.6, last = i === arr.length - 1, big = i === 0 && v >= 25;
        h += '<rect x="' + x + '" y="' + y + '" width="' + (w - 2) + '" height="34" rx="4" fill="' + (big ? "var(--hl)" : last ? "var(--sage-soft)" : "var(--sage)") + '" stroke="' + (last ? "var(--line)" : "none") + '"/>';
        if (v >= 9) h += '<text x="' + (x + w / 2) + '" y="' + (y + 22) + '" text-anchor="middle" class="svg-text" font-size="12" font-weight="600" fill="#192520">' + (last ? "Others" : v + "%") + '</text>';
        x += w;
      });
      return h;
    }
    return '<svg viewBox="0 0 600 170" role="img" aria-label="Customer concentration compared">' +
      bar(A, 32, "Risky: one customer is 40% of revenue") + bar(B, 112, "Safer: no customer is more than 12%") + '</svg>';
  }

  var ORDER = ["hub", "switzerland", "recurring", "teeter", "financial", "monopoly", "satisfaction", "growth"];
  function quickRead() {
    var answered = DRIVERS.filter(function (d) { return state.ans[d.key] != null; }).length;
    if (!answered) {
      return '<div class="fade"><p class="eyebrow">Your results</p><h2 class="h">Your <em>quick read</em></h2>' +
        '<p class="lead">Answer the quick check in each driver chapter and your read appears here. It takes about a minute.</p>' +
        '<p class="body"><button class="btn dark" type="button" data-go="' + FIRST_DRIVER + '">Go to the first driver</button></p></div>';
    }
    var start = null, low = 9;
    ORDER.forEach(function (k) { var v = state.ans[k]; if (v != null && v < low) { low = v; start = k; } });
    var rows = DRIVERS.map(function (d) {
      var v = state.ans[d.key], w = v == null ? 0 : (v + 1) / 3 * 100;
      var lvl = v == null ? "Not answered" : ["Needs work", "Getting there", "Strong"][v];
      return '<div class="sum-row' + (d.key === start ? " start" : "") + '"><span class="nm">' + d.name + '</span><span class="track"><i style="width:' + w + '%"></i></span><span class="lv">' + lvl + '</span></div>';
    }).join("");
    var trap = ["hub", "switzerland", "recurring"].map(function (k) { return state.ans[k]; });
    var trapWeak = trap.filter(function (v) { return v === 0; }).length;
    var s = DRIVERS.filter(function (d) { return d.key === start; })[0];
    return '<div class="fade"><p class="eyebrow">Your results</p><h2 class="h">Your <em>quick read</em></h2>' +
      '<p class="lead">Here’s where your answers put you across the eight drivers' + (answered < 8 ? " (" + answered + " of 8 answered)" : "") + '. Your lowest driver is where to start, because it’s holding your value back the most.</p>' +
      '<div class="sum">' + rows + '</div>' +
      (s ? '<div class="callout"><h3>Start with <em>' + s.name + '</em></h3><p>' + s.lever + '</p></div>' : "") +
      '<p class="body">Three of the drivers do the most to free you from the business: <b>Hub and Spoke</b>, <b>Switzerland Structure</b> and <b>Recurring Revenue</b>. Together they show how much of the business still depends on you, its customers or the next sale. ' +
      (trapWeak >= 2 ? 'Two or more of yours need work, so the business still leans hard on you. That’s the most common starting point, and the most rewarding one to fix.' : 'Yours are in better shape than most, which gives you a strong base to build on.') + '</p>' +
      '<p class="note">This quick read comes from eight questions and is a starting point, not your score.</p></div>';
  }

  function never() {
    return '<div class="fade"><p class="eyebrow">The takeaway</p><h2 class="h">Even if you <em>never</em> sell</h2>' +
      '<p class="lead">Selling might be years away, or never. The eight drivers still pay you every week, because each one takes something off your plate while it adds to your value.</p>' +
      '<div class="groups">' +
        group("Your time back", "Hub and Spoke, Growth Potential and the people side of Switzerland Structure hand work off your desk.", ["Fewer decisions waiting for you", "Vacations that don’t stop revenue", "Growth that doesn’t mean longer weeks"]) +
        group("Cash and calm", "The Teeter-Totter, Recurring Revenue and Financial Performance smooth out the money.", ["Customers pay before the work", "Every month starts partly paid", "Numbers you trust, every month"]) +
        group("Pricing power", "Monopoly Control and Customer Satisfaction let you charge what you’re worth.", ["Less competing on price", "Customers who stay and refer", "Proof a buyer will pay for"]) +
      '</div>' +
      '<p class="body">That’s the whole idea behind building it like you’ll sell it. You run a business that’s easier to own today, and if you ever do sell, it’s worth far more to the person buying it.</p>' +
      '<div class="callout"><h3>Your next step: get your <em>real</em> number</h3><p>The Sell Your Business Blueprint scores all eight drivers from your own books and Business Brain, gives you a value range today and in 12 months, and writes your first step for every lever. Open your Sell Your Business project in Claude and type:</p>' +
      '<div class="prompt"><code id="cmd">Run the Sell Your Business Blueprint.</code><button class="btn primary" type="button" id="copyCmd">Copy</button></div></div>' +
      '<div class="trio">' +
        card("This week", "Run your Blueprint and send the first step it writes for you.", "1") +
        card("This month", "Pull the one lever from your lowest driver, and hand off one function only you do.", "2") +
        card("In 90 days", "Run the Blueprint again and see how far your score and value moved.", "3") +
      '</div></div>';
  }
  function group(t, p, items) {
    return '<div class="card"><h3>' + t + '</h3><p>' + p + '</p><ul>' + items.map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul></div>';
  }

  /* ---------- Render ---------- */
  function render(focus) {
    var c = CHAPTERS[state.ch];
    state.seen[c.id] = true; save();
    var html = c.id === "welcome" ? welcome() : c.id === "book" ? book() : c.id === "pricing" ? pricing() : c.id === "read" ? quickRead() : c.id === "never" ? never() : driver(c.driver);
    $("stage").innerHTML = html;
    $("rail").innerHTML = railHTML(); $("sheetRail").innerHTML = railHTML();
    $("bar").style.width = ((state.ch + 1) / CHAPTERS.length * 100) + "%";
    $("navLeft").textContent = "Chapter " + (state.ch + 1) + " of " + CHAPTERS.length + ", about " + minsLeft(state.ch) + " min left";
    $("prev").disabled = state.ch === 0;
    $("next").textContent = state.ch === CHAPTERS.length - 1 ? "Start over" : state.ch === 0 ? "Start the masterclass" : "Next";
    if (c.id === "pricing") updateCalc();
    if (focus) { window.scrollTo({ top: 0, behavior: "auto" }); $("stage").focus({ preventScroll: true }); }
  }
  function go(i) { state.ch = Math.max(0, Math.min(CHAPTERS.length - 1, i)); render(true); }

  /* ---------- Events ---------- */
  $("next").addEventListener("click", function () { go(state.ch === CHAPTERS.length - 1 ? 0 : state.ch + 1); });
  $("prev").addEventListener("click", function () { go(state.ch - 1); });
  document.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if ($("sheet").open) return;
    if (e.key === "ArrowRight") go(state.ch + 1);
    if (e.key === "ArrowLeft") go(state.ch - 1);
  });
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go],[data-ans],[data-stop],[data-hub],#copyCmd");
    if (!t) return;
    if (t.hasAttribute("data-go")) { if ($("sheet").open) $("sheet").close(); go(+t.getAttribute("data-go")); return; }
    if (t.hasAttribute("data-ans")) {
      var d = DRIVERS[CHAPTERS[state.ch].driver], k = +t.getAttribute("data-ans");
      state.ans[d.key] = k; save();
      Array.prototype.forEach.call(t.parentNode.children, function (b) { b.setAttribute("aria-pressed", b === t ? "true" : "false"); });
      var fb = $("fb"); fb.hidden = false; fb.textContent = d.fb[k];
      if (d.key === "teeter") $("seesaw").innerHTML = seesaw(k);
      return;
    }
    if (t.hasAttribute("data-stop")) {
      calc.stop = +t.getAttribute("data-stop");
      Array.prototype.forEach.call(t.parentNode.children, function (b) { b.setAttribute("aria-pressed", b === t ? "true" : "false"); });
      updateCalc(); return;
    }
    if (t.hasAttribute("data-hub")) {
      var m = +t.getAttribute("data-hub");
      Array.prototype.forEach.call(t.parentNode.children, function (b) { b.setAttribute("aria-pressed", b === t ? "true" : "false"); });
      $("hubviz").innerHTML = hub(m);
      $("hubcap").textContent = m ? "Each function has an owner, a playbook and the numbers to run it. You set direction and step in by choice." : "Everything runs through the owner. When the owner stops, so does the business.";
      return;
    }
    if (t.id === "copyCmd") {
      var txt = $("cmd").textContent;
      function done() { t.textContent = "Copied"; }
      try { navigator.clipboard.writeText(txt).then(done, function () { selectCmd(); }); } catch (err) { selectCmd(); }
      function selectCmd() { var r = document.createRange(); r.selectNodeContents($("cmd")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = "Selected, now copy it"; }
    }
  });
  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "profit") { calc.profit = +e.target.value; updateCalc(); }
  });
  $("menuBtn").addEventListener("click", function () { $("sheet").showModal(); });
  $("sheetClose").addEventListener("click", function () { $("sheet").close(); });
  $("sheet").addEventListener("click", function (e) { if (e.target === $("sheet")) $("sheet").close(); });

  render(false);
})();
</script>
</body>
</html>
